---
layout: default
---

<section class="page-header" style="background-image: url('{{ '/assets/images/hero/toronto-cityscape.jpg' | relative_url }}');">
    <div class="page-header-overlay"></div>
    <div class="container">
        <h1>News & Updates</h1>
    </div>
</section>

<section class="page-content">
    <div class="container">
        <div class="content-with-sidebar">
            <main class="main-column">
                <article class="post">
                    <h2 class="post-title">{{ page.title }}</h2>
                    <div class="post-meta">
                        <time datetime="{{ page.date | date_to_xmlschema }}">
                            {{ page.date | date: "%B %d, %Y" }}
                        </time>
                        {% if page.author %}
                        <span class="post-author">by {{ page.author }}</span>
                        {% endif %}
                    </div>

                    <div class="post-content">
                        {{ content }}
                    </div>

                    <footer class="post-footer">
                        <a href="{{ '/news' | relative_url }}" class="back-link">← Back to News</a>
                    </footer>
                </article>
            </main>

            <aside class="sidebar">
                {% include news-sidebar.html %}
            </aside>
        </div>
    </div>
</section>
