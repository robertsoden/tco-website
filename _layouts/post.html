---
layout: default
---

<section class="page-header">
    <div class="container">
        <h1>{{ page.title }}</h1>
    </div>
</section>

<article class="post">
    <div class="container">
        <div class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%B %d, %Y" }}
            </time>
            {% if page.author %}
            <span class="post-author">by {{ page.author }}</span>
            {% endif %}
        </div>

        <div class="post-content">
            {{ content }}
        </div>

        <footer class="post-footer">
            <a href="{{ '/news' | relative_url }}" class="back-link">← Back to News</a>
        </footer>
    </div>
</article>
