# Site settings
title: Toronto Climate Observatory
email: toronto@climateobservatory.ca
description: >-
  The Toronto Climate Observatory is a research and knowledge hub dedicated to supporting
  just, place-based climate action across the Greater Toronto Area.
url: "https://climateobservatory.ca" # the base hostname & protocol for your site
baseurl: "" # custom domain at the root: leave empty
timezone: America/Toronto

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Clean post URLs (no category segments)
permalink: /news/:year/:month/:day/:title/

# Collections
collections:
  team:
    output: true
    permalink: /team/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team-member"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - docs/
  - scripts/
  - README.md
  - CLAUDE.md
  - .vm-gems/
